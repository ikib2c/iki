# Sincronizacion automatica de los catalogos de proveedores:
# descarga Gava, Sublimados Majestic, Jugueteria Taiwan, Solobabys y Open Mind;
# regenera catalogo.js (tienda) y los 5 Excel completos; y publica los cambios.
#
# Requisito (una sola vez): Settings > Actions > General > Workflow permissions
# debe estar en "Read and write permissions" para que el bot pueda hacer push.
name: Sincronizar catalogos

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas (UTC)
  workflow_dispatch: # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: write

concurrency:
  group: sync-catalogos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: el panel publica data/configuracion.js
                           # por API mientras el cron corre; el push seguro lo absorbe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install openpyxl
      - name: Sincronizar catalogos
        run: python scripts/sync_catalogos.py
      - name: Publicar cambios (si los hay)
        run: |
          git config user.name  "ikib2c-bot"
          git config user.email "ikib2c@users.noreply.github.com"
          git add catalogo.js *.xlsx img
          if ! git diff --cached --quiet; then
            git commit -m "sync: actualiza catalogo de la tienda y Excel de proveedores [skip ci]"
            # Si el panel publico la configuracion mientras este cron corria,
            # el repositorio quedo adelante: se absorbe con rebase (el panel
            # solo toca data/configuracion.js, nunca catalogo.js ni los Excel,
            # asi que no hay conflicto posible) y se reintenta el push.
            if ! git pull --rebase origin main; then
              echo "No se pudo absorber lo publicado por el panel; el catalogo se regenera en la proxima corrida."
              exit 1
            fi
            git push
          else
            echo "Sin cambios: los catalogos ya estaban al dia."
          fi
